name: Déploiement Serveur Web Nginx

on:
  push:
    branches: [ main ]

jobs:
  deploy-infra:
    runs-on:
      - self-hosted
      - Linux
      - X64
      - os2
    outputs:
      vm_ip: ${{ steps.deploy.outputs.ip }}
    
    steps:
      - uses: actions/checkout@v4

      - name: Rendre le script exécutable 
        run: chmod +x scripts/deploy_vm.sh

     
      - name: Déploiement du serveur Nginx
        id: deploy
        run: |
          VM_NAME=$(yq '.vm.name' intent.yaml)
          ./scripts/deploy_vm.sh $VM_NAME

 
      - name: Installation Nginx sur serveurs Web
        run: |
          ssh -i ~/.ssh/ostack fred@${{ steps.deploy.outputs.vm_ip }} 'bash -s' < scripts/install_nginx.sh
